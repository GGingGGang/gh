server {
    listen 8080;
    server_name _;
    root /git/current/public;
    index index.html;
    autoindex off;
    charset utf-8;
    server_tokens off;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Process health is independent of the first Git clone and later GitHub outages.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ (^|/)\. { return 404; }
    location ~* \.(pdf|md|docx?|pptx?|xlsx?)$ { return 404; }

    # Only generated public files are served. Missing sources must remain 404.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
