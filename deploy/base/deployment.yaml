apiVersion: apps/v1
kind: Deployment
metadata:
  name: eu-ai-act
  labels:
    app.kubernetes.io/name: eu-ai-act
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: eu-ai-act
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eu-ai-act
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 65533
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.4.0
          args:
            - --repo=https://github.com/ggingggang/gh.git
            - --root=/git
            - --link=current
            - --ref=main
            - --period=30s
            - --depth=1
            - --max-failures=-1
            - --http-bind=:2020
          env:
            - name: HOME
              value: /tmp
          ports:
            - name: git-health
              containerPort: 2020
          startupProbe:
            httpGet:
              path: /
              port: git-health
            periodSeconds: 5
            failureThreshold: 120
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: git-health
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: web
              mountPath: /git
            - name: git-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsUser: 65533
            runAsGroup: 65533
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.28-alpine
          command: [nginx]
          args: [-g, "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
          volumeMounts:
            - name: web
              mountPath: /git
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: web
          emptyDir: {}
        - name: git-tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-conf
          configMap:
            name: eu-ai-act-nginx
